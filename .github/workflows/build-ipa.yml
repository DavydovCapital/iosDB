name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ios-retro-gunner/package-lock.json

      - name: Install dependencies
        working-directory: ios-retro-gunner
        run: npm ci

      - name: Build web assets
        working-directory: ios-retro-gunner
        run: npm run build

      - name: Sync Capacitor iOS project
        working-directory: ios-retro-gunner
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios-retro-gunner/ios/App
        run: pod install --repo-update

      - name: Archive (no code signing)
        working-directory: ios-retro-gunner/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" Payload/
          zip -r -q Cobra-Strike-unsigned.ipa Payload
          ls -lh Cobra-Strike-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Cobra-Strike-unsigned-ipa
          path: Cobra-Strike-unsigned.ipa
